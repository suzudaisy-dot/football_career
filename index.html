<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Career Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e8eef7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:28px}.muted{color:#93a4bd;font-size:13px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}
.card{background:#121c2d;border:1px solid #24344d;border-radius:14px;padding:18px;box-shadow:0 8px 25px #0003}
label{display:block;font-size:13px;color:#a9b8cc;margin:12px 0 6px}input,select{width:100%;padding:10px 11px;border-radius:9px;border:1px solid #344861;background:#0c1524;color:#fff}
button{border:0;border-radius:9px;padding:13px 16px;font-weight:700;cursor:pointer;background:#2f80ed;color:white;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:46px}button:disabled{opacity:.55;cursor:not-allowed}button.secondary{background:#25354e}button.danger{background:#b94040}
.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.hero{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}
.name{font-size:26px;font-weight:800}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#213657;color:#9bc5ff;font-size:12px;margin:3px}
.ovr{font-size:42px;font-weight:900}.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}.stat{background:#0c1524;border-radius:9px;padding:9px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:#8fa1ba}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.meta div{background:#0c1524;border-radius:9px;padding:10px}.meta small{display:block;color:#8295af}.meta b{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}th,td{padding:9px 6px;border-bottom:1px solid #24344d;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.log{max-height:220px;overflow:auto;margin-top:10px}.event{padding:9px;border-left:3px solid #3b82f6;background:#0d1727;margin-bottom:6px;border-radius:5px}
.empty{padding:28px;text-align:center;color:#8192ab}.retired{opacity:.65}
@media(max-width:800px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(3,1fr)}.meta{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>⚽ Football Career Simulator</h1><div class="muted">1年ずつ進めて、選手のキャリアをシミュレーション</div></div><div class="muted" id="seasonLabel">未開始</div></div>
<div class="grid">
<section class="card">
<h2>選手作成</h2>
<label>選手名</label><input id="name" value="鈴木 太郎">
<label>開始年齢</label><input id="age" type="number" min="15" max="25" value="18">
<label>ポジション</label><select id="pos"><option>GK</option><option>CB</option><option>SB</option><option>DMF</option><option>CMF</option><option>AMF</option><option>WG</option><option>ST</option><option>CF</option></select>
<label>プレースタイル</label><select id="style"><option>テクニック型</option><option>スピード型</option><option>フィジカル型</option><option>パサー型</option><option>ストライカー型</option><option>守備職人型</option></select>
<label>開始クラブ</label><select id="club"><option>高校・ユース</option><option>J1クラブ</option><option>J2クラブ</option><option>J3クラブ</option><option>大学サッカー</option></select>
<div class="actions"><button id="startBtn" type="button">キャリア開始</button><button id="resetBtn" class="secondary" type="button">リセット</button></div>
<hr style="border-color:#24344d;margin:20px 0">
<div class="muted">2026年の実在Jリーグ60クラブをベースにしたキャリア分岐</div>
<ul class="muted"><li>能力値が年齢・出場機会で成長</li><li>移籍・代表・怪我などのイベント</li><li>ポジション別の成績生成</li><li>引退までのキャリアを保存</li></ul>
</section>

<section class="card" id="main"><div class="empty">選手を作成するとキャリアが始まります。</div></section>
</div></div>
<script>
const clubs={
J1:["鹿島アントラーズ","水戸ホーリーホック","浦和レッズ","ジェフユナイテッド千葉","柏レイソル","FC東京","東京ヴェルディ","FC町田ゼルビア","川崎フロンターレ","横浜F・マリノス","清水エスパルス","名古屋グランパス","京都サンガF.C.","ガンバ大阪","セレッソ大阪","ヴィッセル神戸","ファジアーノ岡山","サンフレッチェ広島","アビスパ福岡","V・ファーレン長崎"],
J2:["北海道コンサドーレ札幌","ヴァンラーレ八戸","ベガルタ仙台","ブラウブリッツ秋田","モンテディオ山形","いわきFC","栃木シティ","RB大宮アルディージャ","横浜FC","湘南ベルマーレ","ヴァンフォーレ甲府","アルビレックス新潟","カターレ富山","藤枝MYFC","ジュビロ磐田","徳島ヴォルティス","愛媛FC","FC今治","サガン鳥栖","大分トリニータ"],
J3:["福島ユナイテッドFC","栃木SC","ザスパ群馬","SC相模原","松本山雅FC","AC長野パルセイロ","ツエーゲン金沢","FC岐阜","レイラック滋賀FC","FC大阪","奈良クラブ","ガイナーレ鳥取","レノファ山口FC","カマタマーレ讃岐","高知ユナイテッドSC","ギラヴァンツ北九州","ロアッソ熊本","鹿児島ユナイテッドFC","FC琉球","テゲバジャーロ宮崎"],
EU:["ブライトン","セルティック","PSV","フライブルク","ボローニャ","シュトゥットガルト","レアル・ソシエダ","アヤックス","ベンフィカ","スポルティングCP","モナコ","マルセイユ","ドルトムント","バイエルン","アーセナル","リヴァプール","マンチェスター・シティ","チェルシー","バルセロナ","レアル・マドリード","インテル","ユヴェントス","ナポリ","アトレティコ・マドリード"]
};
let p=null;
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function avg(a){return Math.round(a.reduce((x,y)=>x+y,0)/a.length)}
function start(){
 const age=+document.getElementById("age").value;
 p={name:document.getElementById("name").value||"名無し",age,pos:document.getElementById("pos").value,style:document.getElementById("style").value,club:document.getElementById("club").value,year:new Date().getFullYear(),retired:false,career:[],events:[],stats:{apps:0,g:0,a:0,cs:0},s:{PAC:r(55,72),SHO:r(45,70),PAS:r(50,75),DRI:r(48,72),DEF:r(35,70),PHY:r(45,75)}};
 if(p.pos==="GK")p.s={PAC:r(35,60),SHO:r(10,35),PAS:r(45,70),DRI:r(20,45),DEF:r(55,78),PHY:r(55,78)};
 addEvent(`${p.age}歳：${p.club}からプロキャリアを開始。`);
 render();
}
function addEvent(x){p.events.unshift({age:p.age,text:x})}
function clubTier(){
 if(p.club==="高校・ユース"||p.club==="大学サッカー")return 0;
 if(clubs.J3.includes(p.club))return 1;
 if(clubs.J2.includes(p.club))return 2;
 if(clubs.J1.includes(p.club))return 3;
 if(clubs.EU.includes(p.club))return 4;
 return 0;
}
function randomClub(tier){
 const list=tier===1?clubs.J3:tier===2?clubs.J2:tier===3?clubs.J1:clubs.EU;
 return list[r(0,list.length-1)];
}
function nextYear(){
 if(!p||p.retired)return;
 p.age++;p.year++;
 let tier=clubTier(), ovr=avg(Object.values(p.s));
 let growth=p.age<23?r(2,5):p.age<28?r(0,3):p.age<32?r(-1,2):r(-3,0);
 let minutes=clamp(15+(ovr-tier*8)+r(-20,20),5,95);
 if(p.age>30)minutes-=Math.max(0,p.age-30)*3;
 const keys=Object.keys(p.s);
 keys.forEach(k=>{let bias=0;if(p.style==="テクニック型"&&["PAS","DRI"].includes(k))bias=1;if(p.style==="スピード型"&&k==="PAC")bias=1;if(p.style==="ストライカー型"&&k==="SHO")bias=1;if(p.style==="守備職人型"&&k==="DEF")bias=1;p.s[k]=clamp(p.s[k]+growth/2+r(-1,1)+bias,15,95)});
 ovr=avg(Object.values(p.s));
 let apps=Math.round(minutes/100*38), g=0,a=0,cs=0;
 if(["ST","CF","WG","AMF"].includes(p.pos)){g=Math.max(0,Math.round(apps*(p.s.SHO/100)*r(10,22)/10));a=Math.max(0,Math.round(apps*(p.s.PAS/100)*r(5,13)/10))}
 else if(["GK"].includes(p.pos)){cs=Math.max(0,Math.round(apps*(p.s.DEF/100)*r(15,30)/20))}
 else {g=Math.max(0,Math.round(apps*(p.s.SHO/100)*r(3,9)/10));a=Math.max(0,Math.round(apps*(p.s.PAS/100)*r(6,14)/10));cs=Math.max(0,Math.round(apps*(p.s.DEF/100)*r(8,18)/10))}
 let pass=clamp(Math.round(p.s.PAS+r(-8,8)),45,97);
 let club=p.club;
 if(p.age>=18&&tier===0){club=["J1クラブ","J2クラブ","J3クラブ"][r(0,2)];addEvent(`${p.age}歳：${club}からプロ契約オファー。`)}
 else if(tier>=1&&p.age<32&&ovr>=72&&Math.random()<.25){club=p.age>=24&&ovr>=78?"欧州クラブ":"J1クラブ";addEvent(`${p.age}歳：${club}へ移籍！`)}
 else if(tier===3&&ovr<55&&Math.random()<.15){club="J2クラブ";addEvent(`${p.age}歳：出場機会を求めてJ2へ移籍。`)}
 if(Math.random()<.07){addEvent(`${p.age}歳：負傷で一部期間を離脱。`);apps=Math.max(0,Math.round(apps*.65))}
 if(p.age>=20&&ovr>=70&&Math.random()<.08)addEvent(`${p.age}歳：日本代表に初招集！`);
 if(p.age>=25&&ovr>=82&&Math.random()<.04)addEvent(`${p.age}歳：海外メディアから注目を集める。`);
 if(tier>=2&&tier<=3&&p.age<=24&&Math.random()<.07){
 const loanTier=tier===3?2:1;
 addEvent(`${p.age}歳：${randomClub(loanTier)}へ期限付き移籍。`);
}
p.club=club;p.stats.apps+=p.stats.g+=g;p.stats.a+=a;p.stats.cs+=cs;
 let salary=Math.round((50+ovr*12+clubTier()*350)*r(85,120)/100);
 p.career.push({year:p.year,age:p.age,club,ovr,apps,g,a,cs,pass,salary});
 if(p.age>=34&&Math.random()<.22||p.age>=38){p.retired=true;addEvent(`${p.age}歳：現役引退。キャリア終了。`)}
 render();
}
function render(){
 const ovr=avg(Object.values(p.s)), last=p.career[p.career.length-1];
 document.getElementById("seasonLabel").textContent=p.year+"シーズン";
 document.getElementById("main").innerHTML=`
 <div class="hero"><div><div class="name">${p.name}</div><span class="badge">${p.pos}</span><span class="badge">${p.style}</span><span class="badge">${p.club}</span></div><div class="ovr">${ovr}</div></div>
 <div class="statgrid">${Object.entries(p.s).map(([k,v])=>`<div class="stat"><b>${Math.round(v)}</b><span>${k}</span></div>`).join("")}</div>
 <div class="meta"><div><small>年齢</small><b>${p.age}歳</b></div><div><small>通算出場</small><b>${p.stats.apps}</b></div><div><small>通算得点</small><b>${p.stats.g}</b></div><div><small>通算アシスト</small><b>${p.stats.a}</b></div></div>
 <div class="actions"><button id="nextBtn" type="button" ${p.retired?"disabled":""}>${p.retired?"キャリア終了":"▶ 1年進める"}</button></div>
 <h3>シーズン履歴</h3>${p.career.length?`<div style="overflow:auto"><table><thead><tr><th>年齢</th><th>クラブ</th><th>OVR</th><th>出場</th><th>G</th><th>A</th><th>CS</th><th>パス成功</th><th>年俸</th></tr></thead><tbody>${[...p.career].reverse().map(x=>`<tr><td>${x.age}</td><td style="text-align:left">${x.club}</td><td>${x.ovr}</td><td>${x.apps}</td><td>${x.g}</td><td>${x.a}</td><td>${x.cs}</td><td>${x.pass}%</td><td>${x.salary}万円</td></tr>`).join("")}</tbody></table></div>`:"<div class='empty'>まだシーズン成績はありません。「1年進める」を押してください。</div>"}
 <h3>イベント</h3><div class="log">${p.events.map(e=>`<div class="event"><b>${e.age}歳</b>　${e.text}</div>`).join("")}</div>`;
 const nextBtn=document.getElementById("nextBtn");
 if(nextBtn) nextBtn.addEventListener("click", nextYear);
}
function resetSim(){p=null;document.getElementById("seasonLabel").textContent="未開始";document.getElementById("main").innerHTML='<div class="empty">選手を作成するとキャリアが始まります。</div>'}
document.addEventListener("DOMContentLoaded", function(){
  const startBtn=document.getElementById("startBtn");
  const resetBtn=document.getElementById("resetBtn");
  startBtn.addEventListener("click", start);
  resetBtn.addEventListener("click", resetSim);
});

</script>
</body></html>
